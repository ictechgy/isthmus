          #!/usr/bin/env python3
          """Observe fixed public registry metadata; never authorizes a publication.
          
          Standard library only. No package installation, subprocess, credentials, writes
          to services, redirects, or response-derived requests. Output is a JSON receipt.
          The reviewed workflow embeds this file and coordinates.json without checkout.
          """
          
          import datetime
          import hashlib
          import http.client
          import json
          import math
          import pathlib
          import re
          import signal
          import socket
          import sys
          import time
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          
          
          MAX_BYTES = 2 * 1024 * 1024
          SOCKET_SECONDS = 8
          WALL_SECONDS = 20
          COORDINATES_SHA256 = "1474c2da12cd7f9b1884350f99da3c2b0faedfb107941de3b588060b4d327e01"
          
          
          def utc_now():
              return datetime.datetime.now(datetime.timezone.utc).isoformat()
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          def deadline(_signum, _frame):
              raise TimeoutError("Request wall-clock limit exceeded")
          
          
          def request_metadata(url):
              """GET one reviewed HTTPS URL with bounded time and response bytes."""
              result = {"url": url, "started_at": utc_now(), "http_status": None,
                        "body_sha256": None, "body_hash_scope": None}
              started = time.monotonic()
              body = bytearray()
              response = None
              signal.signal(signal.SIGALRM, deadline)
              signal.alarm(WALL_SECONDS)
              try:
                  opener = urllib.request.build_opener(
                      urllib.request.ProxyHandler({}), NoRedirect())
                  req = urllib.request.Request(url, method="GET", headers={
                      "User-Agent": "graph-release-registry-preflight/1.0",
                      "Accept-Encoding": "identity",
                      "Accept": "application/json, application/xml, text/plain",
                  })
                  try:
                      response = opener.open(req, timeout=SOCKET_SECONDS)
                  except urllib.error.HTTPError as exc:
                      response = exc
                  result["http_status"] = response.code
                  result["headers"] = {name: response.headers.get(name) for name in (
                      "Date", "Age", "ETag", "Last-Modified", "Content-Type",
                      "Content-Length", "Content-Encoding")}
                  while len(body) <= MAX_BYTES:
                      chunk = response.read(min(65536, MAX_BYTES + 1 - len(body)))
                      if not chunk:
                          break
                      body.extend(chunk)
                  result["body_complete"] = len(body) <= MAX_BYTES
                  if not result["body_complete"]:
                      result["error"] = "response_size_limit"
                  elif response.headers.get("Content-Length") is not None:
                      length_text = response.headers.get("Content-Length").strip()
                      if len(length_text) > 20 or not re.fullmatch(r"[0-9]+", length_text):
                          result["body_complete"] = False
                          result["error"] = "invalid_content_length"
                      elif int(length_text) != len(body):
                          result["body_complete"] = False
                          result["error"] = "content_length_mismatch"
                  if response.headers.get("Content-Encoding", "identity") != "identity":
                      result["error"] = "unexpected_content_encoding"
              except (urllib.error.URLError, TimeoutError, socket.timeout, OSError,
                      http.client.HTTPException) as exc:
                  result["error"] = type(exc).__name__
                  result["body_complete"] = False
              finally:
                  signal.alarm(0)
                  if response is not None:
                      response.close()
                  result["completed_at"] = utc_now()
                  result["elapsed_seconds"] = round(time.monotonic() - started, 3)
                  result["body_bytes"] = len(body)
                  result["body_sha256"] = hashlib.sha256(body).hexdigest()
                  result["body_hash_scope"] = (
                      "full" if result.get("body_complete") else "received_prefix_only")
              return result, bytes(body)
          
          
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate_json_key")
                  result[key] = value
              return result
          
          
          def parse_json(body):
              def reject_nonfinite(_constant):
                  raise ValueError("nonfinite_json_constant")
              def finite_float(value):
                  parsed = float(value)
                  if not math.isfinite(parsed):
                      raise ValueError("nonfinite_json_number")
                  return parsed
              return json.loads(body.decode("utf-8"), object_pairs_hook=unique_object,
                                parse_constant=reject_nonfinite, parse_float=finite_float)
          
          
          def exact_name(actual, expected):
              if not isinstance(actual, str) or actual != expected:
                  raise ValueError("coordinate_mismatch")
          
          
          def inspect_metadata(target, body):
              kind, name, version = (target[k] for k in (
                  "kind", "coordinate", "target_version"))
              detail = {}
              if kind == "pypi":
                  data = parse_json(body)
                  exact_name(data["info"]["name"], name)
                  versions = data["releases"]
                  if not isinstance(versions, dict):
                      raise ValueError("invalid_version_map")
                  detail["advertised_latest"] = data["info"]["version"]
                  if version in versions:
                      detail["target_file_count"] = len(versions[version])
              elif kind == "npm":
                  data = parse_json(body)
                  exact_name(data["name"], name)
                  versions = data["versions"]
                  if not isinstance(versions, dict):
                      raise ValueError("invalid_version_map")
                  detail["advertised_latest"] = data.get("dist-tags", {}).get("latest")
                  # An unpublished version may survive in time metadata and is not free.
                  if version in data.get("time", {}) and version not in versions:
                      return {"state": "historically_occupied", "version_count": len(versions)}
              elif kind == "pub":
                  data = parse_json(body)
                  exact_name(data["name"], name)
                  if not isinstance(data["versions"], list) or not data["versions"]:
                      raise ValueError("invalid_versions")
                  versions = [entry["version"] for entry in data["versions"]]
                  detail["advertised_latest"] = data["latest"]["version"]
              elif kind == "crates":
                  entries = [parse_json(line) for line in body.splitlines() if line.strip()]
                  if not entries:
                      raise ValueError("empty_crates_index")
                  for entry in entries:
                      exact_name(entry["name"], name)
                  versions = [entry["vers"] for entry in entries]
                  detail["target_yanked"] = next(
                      (entry.get("yanked") for entry in entries if entry["vers"] == version),
                      None)
              elif kind in ("maven-central", "maven-pages"):
                  if b"<!DOCTYPE" in body.upper() or b"<!ENTITY" in body.upper():
                      raise ValueError("xml_declaration_forbidden")
                  root = ET.fromstring(body)
                  group, artifact = name.split(":")
                  exact_name(root.findtext("groupId"), group)
                  exact_name(root.findtext("artifactId"), artifact)
                  versions = [node.text for node in root.findall("./versioning/versions/version")]
                  if not versions:
                      raise ValueError("missing_versions")
                  detail["advertised_latest"] = root.findtext("./versioning/release")
              elif kind == "go":
                  versions = body.decode("utf-8").splitlines()
                  if any(not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.+-]+)?", v)
                         for v in versions):
                      raise ValueError("invalid_go_version_list")
                  # The Go proxy list is a cache view, not an origin tag reservation check.
                  return {"state": "present" if version in versions else "not_in_proxy_list",
                          "version_count": len(versions),
                          "caveat": "Absence does not prove the origin Git tag is unused."}
              else:
                  raise ValueError("unsupported_registry")
              if not versions or any(not isinstance(item, str) or not item for item in versions):
                  raise ValueError("missing_or_invalid_versions")
              return {"state": "present" if version in versions else "not_listed",
                      "version_count": len(versions), **detail}
          
          
          def classify_response(target, receipt, body):
              """Only a complete 200 response with validated registry schema can clear listing."""
              observation = {"state": "unknown"}
              if receipt.get("error"):
                  observation["reason"] = receipt["error"]
              elif receipt.get("http_status") != 200:
                  # A 404 can mean a package is missing; it never clears a target version.
                  observation["reason"] = "http_status_not_200"
              elif not receipt.get("body_complete"):
                  observation["reason"] = "incomplete_body"
              else:
                  try:
                      observation = inspect_metadata(target, body)
                  except (ValueError, KeyError, TypeError, AttributeError, RecursionError,
                          ET.ParseError) as exc:
                      observation["reason"] = "schema_or_parse_error:" + type(exc).__name__
              return observation
          
          
          def main():
              coordinate_bytes = pathlib.Path("coordinates.json").read_bytes()
              if hashlib.sha256(coordinate_bytes).hexdigest() != COORDINATES_SHA256:
                  raise SystemExit("Reviewed coordinate file hash mismatch; no requests made.")
              targets = parse_json(coordinate_bytes)
              if len(targets) != 14:
                  raise SystemExit("Unexpected target count; no requests made.")
              report = {"schema_version": 1, "started_at": utc_now(),
                        "coordinates_sha256": COORDINATES_SHA256, "results": [],
                        "limits": {"requests": 14, "bytes_per_response": MAX_BYTES,
                                   "wall_seconds_per_request": WALL_SECONDS},
                        "meaning": "not_listed means absent from a successfully parsed official "
                                   "registry snapshot. It does not prove never-used, ownership, "
                                   "publish permission, or future availability. Recheck before publishing."}
              for target in targets:
                  receipt, body = request_metadata(target["url"])
                  observation = classify_response(target, receipt, body)
                  report["results"].append({**target, "observation": observation, "receipt": receipt})
              report["completed_at"] = utc_now()
              pathlib.Path("registry-receipt.json").write_text(
                  json.dumps(report, indent=2, ensure_ascii=True) + "\n", encoding="utf-8")
              print(json.dumps(report, indent=2, ensure_ascii=True))
              # Fail closed for occupancy, an unverified endpoint, or Go cache non-listing.
              states = [entry["observation"]["state"] for entry in report["results"]]
              return 0 if all(state == "not_listed" for state in states) else 2
          
          
          if __name__ == "__main__":
              sys.exit(main())
          GRAPH_PREFLIGHT
          # Scrub inherited environment. The script makes public GETs only.
          # The entire JSON receipt is retained in Actions logs, even on exit 2.
          env -i PATH=/usr/bin:/bin HOME="$workdir" LANG=C.UTF-8 python3 -I preflight.py
