name: conformance-drift

# 생산자 저장소의 conformance 사본이 이 커밋의 정본보다 낡았는지 주 1회와 수동으로 대조한다.
# 생산자에게 적용되는 케이스가 다르면(stale·modified·missing·unknown) 실패해 저장소 알림으로 드러난다.
# consumer 전용 차이는 실패가 아니다. 생산자는 각 기본 브랜치 HEAD를 읽고, 실행마다 그 SHA를 요약에 남긴다.
# 생산자 테스트는 실행하지 않는다 — 기록과 사본 해시·케이스만 읽는다.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { producer: cartograph }
          - { producer: kartograph }
          - { producer: dartograph }
          - { producer: gartograph }
          - { producer: rustograph }
          - { producer: pythograph }
          - { producer: tsograph }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: isthmus
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ictechgy/${{ matrix.producer }}
          path: producer
          persist-credentials: false
          sparse-checkout: |
            conformance
            conformance.lock
            fixtures/isthmus-conformance
            fixtures/isthmus_conformance
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
      - name: Compare vendored conformance vectors
        env:
          PRODUCER: ${{ matrix.producer }}
        run: |
          set -euo pipefail
          revision="$(git -C producer rev-parse HEAD)"
          echo "${PRODUCER} at ${revision}" >> "$GITHUB_STEP_SUMMARY"
          node isthmus/scripts/conformance-drift.mjs --strict "${PRODUCER}=producer" | tee -a "$GITHUB_STEP_SUMMARY"
