name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:kartograph-evidence
      - name: Verify public corpus archive handling
        run: node --test experiments/real-corpus/public-archive.test.mjs
      - name: Check consumer performance budgets
        run: node scripts/benchmark-preflight.mjs

  kartograph-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ictechgy/kartograph
          ref: 7b3acbbad87184992b39d948844318ba37fb153e
          path: .producer/kartograph
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - run: npm ci
      - run: npm run build
      - run: npm run test:kartograph-evidence
      - name: Build pinned Kartograph reader and compiler witness producer
        working-directory: .producer/kartograph
        run: ./gradlew --no-daemon --max-workers=2 :cli:installDist :gradle-plugin:jar
      - name: Verify actual source, configuration and artifact binding
        run: node scripts/verify-kartograph-evidence.mjs .producer/kartograph build/kartograph-evidence
      - name: Preserve bounded public fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kartograph-evidence
          path: |
            build/kartograph-evidence/verification.json
            build/kartograph-evidence/logs/
            build/kartograph-evidence/inputs/
            build/kartograph-evidence/*/receipt.json
            build/kartograph-evidence/*/snapshot.json
            build/kartograph-evidence/*/persistence.json
            build/kartograph-evidence/*/reverse.json
            build/kartograph-evidence/task.json
          if-no-files-found: warn
          retention-days: 7

  aidlc-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
      - run: npm ci
      - run: npm run build
      - run: npm run test:aidlc
      - name: Fetch pinned official portable AI-DLC assets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aidlc-assets"
          curl --fail --location --retry 2 https://github.com/awslabs/aidlc-workflows/releases/download/v2.11.1/aidlc-linux-x64 -o "$RUNNER_TEMP/aidlc-assets/aidlc-linux-x64"
          curl --fail --location --retry 2 https://github.com/awslabs/aidlc-workflows/releases/download/v2.11.1/aidlc-runtime-2.11.1.tar.gz -o "$RUNNER_TEMP/aidlc-assets/aidlc-runtime-2.11.1.tar.gz"
      - name: Verify real plugin composition and advisory versus blocking gates
        run: node scripts/verify-aidlc-adapter.mjs "$RUNNER_TEMP/aidlc-assets" "$RUNNER_TEMP/aidlc-smoke"
      - name: Preserve bounded public adapter evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aidlc-adapter-evidence
          path: |
            ${{ runner.temp }}/aidlc-smoke/verification.json
            ${{ runner.temp }}/aidlc-smoke/logs/
            ${{ runner.temp }}/aidlc-smoke/task.json
          if-no-files-found: warn
          retention-days: 7
