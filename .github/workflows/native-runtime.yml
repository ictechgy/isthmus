name: native-runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/native-runtime.yml'
      - 'scripts/verify-rn-android-runtime.mjs'
      - 'scripts/fixtures/rn-new-architecture.mjs'
      - 'scripts/runtime-evidence-manifest*'
      - 'scripts/runtime-harness-failures*'

permissions:
  contents: read

concurrency:
  group: native-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TMPDIR: ${{ runner.temp }}/isthmus-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare owned emulator environment
        run: |
          mkdir -p "$TMPDIR" native-report
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' \
            'system-images;android-36;google_apis_playstore;x86_64'
          "$ANDROID_HOME/emulator/emulator" -version > native-report/emulator-version.txt
      - name: Execute RN release and restart controls
        run: |
          node scripts/verify-rn-android-runtime.mjs "$ANDROID_HOME/platform-tools/adb" \
            --new-architecture --new-emulator > native-report/runtime-local.json
      - name: Preserve bounded verification evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          destination = Path('native-report')
          destination.mkdir(exist_ok=True)
          folders = list(Path(os.environ['TMPDIR']).glob('isthmus-rn-engine-evidence-*'))
          def scrub(value):
              if isinstance(value, dict):
                  return {k: scrub(v) for k, v in value.items() if k != 'evidence'}
              if isinstance(value, list):
                  return [scrub(v) for v in value]
              return value
          if len(folders) == 1:
              for name in ['verification.json', 'runtime.json', 'runtime-restarted.json', 'build.json', 'cleanup.json', 'steps.json', 'evidence-manifest.json']:
                  path = folders[0] / name
                  if path.is_file():
                      value = json.loads(path.read_text())
                      (destination / name).write_text(json.dumps(scrub(value), indent=2) + '\n')
          (destination / 'artifact-scope.json').write_text(json.dumps({
              'scope': 'verification JSON and original raw-file manifest; local configs, app binaries and raw bundle are not uploaded',
              'evidenceDirectories': len(folders)
          }, indent=2) + '\n')
          (destination / 'runtime-local.json').unlink(missing_ok=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rn-android-evidence
          path: native-report/
          if-no-files-found: error
          retention-days: 14
