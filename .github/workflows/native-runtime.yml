name: native-runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/native-runtime.yml'
      - 'scripts/verify-rn-android-runtime.mjs'
      - 'scripts/fixtures/rn-new-architecture.mjs'
      - 'scripts/runtime-evidence-manifest*'
      - 'scripts/runtime-harness-failures*'

permissions:
  contents: read

concurrency:
  group: native-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare owned emulator environment
        run: |
          mkdir -p "$RUNNER_TEMP/isthmus-native" native-report
          echo "TMPDIR=$RUNNER_TEMP/isthmus-native" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libglu1-mesa pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=isthmus
          pactl set-default-sink isthmus
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' \
            'system-images;android-36;google_apis_playstore;x86_64'
          "$ANDROID_HOME/emulator/emulator" -version > native-report/emulator-version.txt
      - name: Execute RN release and restart controls
        id: runtime
        run: |
          node scripts/verify-rn-android-runtime.mjs "$ANDROID_HOME/platform-tools/adb" \
            --new-architecture --new-emulator > native-report/runtime-local.json
      - name: Preserve bounded verification evidence
        if: always()
        env:
          NATIVE_EXECUTION_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          destination = Path('native-report')
          destination.mkdir(exist_ok=True)
          folders = list((Path(os.environ['RUNNER_TEMP']) / 'isthmus-native').glob('isthmus-rn-engine-evidence-*'))
          def scrub(value):
              if isinstance(value, dict):
                  return {k: scrub(v) for k, v in value.items() if k != 'evidence'}
              if isinstance(value, list):
                  return [scrub(v) for v in value]
              return value
          if len(folders) == 1:
              for name in ['verification.json', 'runtime.json', 'runtime-restarted.json', 'build.json', 'cleanup.json', 'steps.json', 'evidence-manifest.json']:
                  path = folders[0] / name
                  if path.is_file():
                      if name == 'verification.json':
                          value = json.loads(path.read_text())
                          (destination / name).write_text(json.dumps(scrub(value), indent=2) + '\n')
                      else:
                          shutil.copyfile(path, destination / name)
              for diagnostic in ['adb-server.log', 'avd-create.log', 'cleanup-uninstall.log', 'build-failure.log']:
                  path = folders[0] / diagnostic
                  if path.is_file():
                      shutil.copyfile(path, destination / diagnostic)
              emulator_log = folders[0] / 'emulator.log'
              if emulator_log.is_file():
                  lines = emulator_log.read_text(errors='replace').splitlines()
                  selected = [line for line in lines if any(word in line.lower() for word in ['audio', 'pulse', 'not enough space', 'error', 'warning', 'boot'])]
                  (destination / 'emulator-audio-diagnostics.txt').write_text('\n'.join(selected[-100:]) + '\n')
          (destination / 'artifact-scope.json').write_text(json.dumps({
              'scope': 'verification JSON and original raw-file manifest; local configs, app binaries and raw bundle are not uploaded',
              'evidenceDirectories': len(folders), 'executionOutcome': os.environ['NATIVE_EXECUTION_OUTCOME']
          }, indent=2) + '\n')
          (destination / 'runtime-local.json').unlink(missing_ok=True)
          if os.environ['NATIVE_EXECUTION_OUTCOME'] == 'success':
              assert len(folders) == 1, 'successful execution must preserve one evidence directory'
              summary = json.loads((destination / 'verification.json').read_text())
              first = json.loads((destination / 'runtime.json').read_text())
              second = json.loads((destination / 'runtime-restarted.json').read_text())
              assert first == summary['observed'] and second == summary['processRestart']['observed']
              assert first['status'] == second['status'] == 'passed' and first['runId'] != second['runId']
              assert first['invocation'] == second['invocation'] == json.loads((destination / 'build.json').read_text())['invocation']
              assert summary['cleanup']['uninstallExit'] == 0 and summary['cleanup']['emulator']['stopped']
              manifest = destination / 'evidence-manifest.json'
              assert hashlib.sha256(manifest.read_bytes()).hexdigest() == summary['evidenceManifest']['sha256']
              hashes = {item['path']: item['sha256'] for item in json.loads(manifest.read_text())['files']}
              for name in ['runtime.json', 'runtime-restarted.json', 'build.json', 'cleanup.json', 'steps.json']:
                  assert hashlib.sha256((destination / name).read_bytes()).hexdigest() == hashes[name]
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: rn-android-evidence
          path: native-report/
          if-no-files-found: error
          retention-days: 14
